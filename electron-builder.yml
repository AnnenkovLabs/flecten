appId: dev.flecten.app
productName: Flecten
copyright: Copyright © 2026 Flecten contributors

directories:
  output: release
  buildResources: build

files:
  # CI pins update-public-key.pem here before packaging; runtime never trusts a remote key.
  - shell/**
  - shared/environment.cjs
  - ui/dist/**
  - package.json

asar: true
protocols:
  - name: Flecten task
    schemes: [flecten, liquid-harness]
npmRebuild: false
afterPack: scripts/notarize.cjs
afterSign: scripts/notarize.cjs

extraResources:
  - from: dist
    to: .
    filter:
      - "flecten-agent*"
  - from: prompts
    to: prompts
  - from: dist/module-marketplace
    to: module-marketplace
  - from: LICENSE
    to: licenses/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: ui/src/assets/fonts/OFL-Manrope.txt
    to: licenses/Manrope-OFL.txt
artifactName: Flecten-${version}-${os}-${arch}.${ext}

# Metadata only: the app replaces this feed with FLECTEN_UPDATE_URL at runtime.
# The generic provider never uploads artifacts, so no publish token is needed.
publish:
  provider: generic
  url: "updates"

linux:
  target:
    - AppImage
  category: Development
  icon: build/icon.png

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Голосовой ввод сообщений в Flecten.

win:
  target:
    - nsis
  icon: build/icon.ico
