name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check
      - run: bun run lint
      - run: bun run build:ui
      - run: bun run build:agent

  package-smoke:
    name: packaged smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          bun run package 2>&1 | tee diagnostics/package.log
      - name: Smoke packaged app
        shell: bash
        run: |
          set -o pipefail
          bun run smoke:packaged 2>&1 | tee diagnostics/smoke.log
      - name: Capture window on failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p diagnostics
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a bun run app:shot > diagnostics/screenshot.log 2>&1 || true
          else
            bun run app:shot > diagnostics/screenshot.log 2>&1 || true
          fi
          bun -e 'const fs = require("node:fs"); const os = require("node:os"); const path = require("node:path"); for (const name of fs.readdirSync(os.tmpdir())) { if (name.startsWith("liquid-ui") && name.endsWith(".png")) fs.copyFileSync(path.join(os.tmpdir(), name), path.join("diagnostics", name)); }'
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-diagnostics-${{ matrix.os }}
          path: |
            diagnostics/**
            release/*/resources/**
            release/*/*.app/Contents/Resources/**
            release/*.yml
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit
