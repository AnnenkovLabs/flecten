name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish prepared release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Require a successful trusted CI run for this exact commit
        id: candidate
        run: bun scripts/release-source.mjs
      - name: Download the immutable candidate and require its archive digest
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.artifact_digest }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/candidate.zip"
          echo "${CANDIDATE_DIGEST#sha256:}  $RUNNER_TEMP/candidate.zip" | sha256sum --check --strict
          python3 - <<'PYTHON'
          import os, pathlib, stat, zipfile
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate.zip') as archive:
              entries = archive.infolist()
              names = [entry.filename for entry in entries]
              if len(names) != len(set(names)) or not 1 <= len(names) <= 65:
                  raise ValueError('Candidate archive contains duplicate files or an invalid file count')
              for entry in entries:
                  if (entry.is_dir() or pathlib.PurePosixPath(entry.filename).name != entry.filename
                      or '\\' in entry.filename or stat.S_ISLNK(entry.external_attr >> 16)):
                      raise ValueError('Candidate archive must contain plain regular files')
              archive.extractall('release')
          PYTHON
      - name: Verify provenance, every byte and signatures, then publish
        env:
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
        run: bun scripts/promote-release.mjs release
