name: Quality

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-coverage:
    name: docs and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun scripts/docs-check.mjs
      - run: bun scripts/coverage.mjs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  electron:
    name: Electron and visual regression (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Install private desktop test prerequisites
        run: sudo apt-get install -y xvfb xauth xdotool imagemagick dbus-x11 python3-gi gir1.2-gtk-3.0
      - name: Require and test the Linux computer conversation
        run: |
          bun -e 'const { computerEnvironmentProblem } = await import("./tests/helpers/computer-environment.ts"); const problem = computerEnvironmentProblem(); if (problem) throw new Error(problem);'
          bun test tests/integration/conversation-modules.test.ts
      - run: bun run build:ui
      - run: bun run build:agent
      - name: Require a working Electron environment
        run: bun -e 'const { environmentProblem } = await import("./tests/e2e/fixtures.ts"); const problem = environmentProblem(); if (problem) throw new Error(problem);'
      - name: Electron scenarios and committed visual baselines
        run: bunx playwright test --shard=${{ matrix.shard }}/3 --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload Electron report and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-report-${{ matrix.shard }}
          path: |
            playwright-report/
            .flecten/e2e-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
