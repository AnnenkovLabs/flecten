name: Build installers

on:
  workflow_call:
    inputs:
      candidate:
        description: Build release installers for a trusted CI candidate
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: windows-latest
            artifact: windows
    env:
      BUILD_INSTALLERS: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - name: Verify macOS before packaging
        if: matrix.artifact == 'macos-arm64'
        run: |
          bun run test
          bun run check
          bun run lint
      - name: Pin update verification key in the application
        if: inputs.candidate || github.event_name == 'workflow_dispatch'
        env:
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: bun scripts/sign-update-manifests.mjs --pin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock', 'electron-builder.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-electron-
      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (matrix.artifact == 'windows' && (secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD) || secrets.CSC_KEY_PASSWORD) || '' }}
          WIN_CSC_LINK: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.artifact == 'windows' && (secrets.WIN_CSC_LINK || secrets.CSC_LINK) || '' }}
          APPLE_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY || secrets.POSTHOG_API_KEY || '' }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://eu.i.posthog.com' }}
        run: |
          set -o pipefail
          mkdir -p diagnostics
          if [ "$BUILD_INSTALLERS" = "true" ]; then
            bun run release 2>&1 | tee diagnostics/package.log
          else
            bun run package 2>&1 | tee diagnostics/package.log
          fi
      - name: Verify the Windows agent starts independently of Electron
        if: runner.os == 'Windows'
        run: |
          bun -e 'const { measureStartup } = await import("./scripts/measure-startup.mjs"); const { resolve } = await import("node:path"); console.log(await measureStartup(resolve("dist/flecten-agent.exe"), { iterations: 1 }));'
      - name: Smoke the packaged release before upload
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ] && [ "$BUILD_INSTALLERS" = "true" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            installers=(release/*.AppImage)
            test -f "${installers[0]}"
            for installer in "${installers[@]}"; do
              chmod +x "$installer"
              FLECTEN_SMOKE_EXECUTABLE="$PWD/$installer" APPIMAGE_EXTRACT_AND_RUN=1 bun run smoke:packaged 2>&1 | tee -a diagnostics/smoke.log
            done
          else
            bun run smoke:packaged 2>&1 | tee diagnostics/smoke.log
          fi
      - name: Capture window on failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          mkdir -p diagnostics
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a bun run app:shot > diagnostics/screenshot.log 2>&1 || true
          else
            bun run app:shot > diagnostics/screenshot.log 2>&1 || true
          fi
          bun -e 'const fs = require("node:fs"); const os = require("node:os"); const path = require("node:path"); for (const name of fs.readdirSync(os.tmpdir())) { if (name.startsWith("flecten-ui") && name.endsWith(".png")) fs.copyFileSync(path.join(os.tmpdir(), name), path.join("diagnostics", name)); }'
      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics-${{ matrix.artifact }}
          path: |
            diagnostics/**
            release/*/resources/**
            release/*/*.app/Contents/Resources/**
            release/*.yml
            release/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload release artifacts
        if: inputs.candidate || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts-${{ matrix.artifact }}
          overwrite: true
          compression-level: 0
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/beta*.yml
            release/UNSIGNED-*.txt
          if-no-files-found: error
