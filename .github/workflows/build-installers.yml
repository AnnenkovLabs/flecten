name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.artifact == 'windows-x64' && (secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD) || secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ matrix.artifact == 'windows-x64' && (secrets.WIN_CSC_LINK || secrets.CSC_LINK) || '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - name: Pin update verification key
        env:
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: bun scripts/sign-update-manifests.mjs --pin
      - run: bun run build:ui
      - run: bun run build:agent
      - name: Package native installers
        run: bunx electron-builder --publish never
      - name: Launch the packaged application
        run: bun run smoke:packaged
        env:
          FLECTEN_HEADLESS: "1"
      - name: Upload installers and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/UNSIGNED-*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics-${{ matrix.artifact }}
          path: |
            release/*.yml
            release/*.log
          if-no-files-found: ignore
          retention-days: 14
